[project]
name = "civitwin-ai"
version = "1.0.0"
description = "Local-first synthetic civic planning sandbox"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.15,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "networkx>=3.4,<4",
    "numpy>=2.2,<3",
    "ortools>=9.12,<10",
    "pydantic>=2.11,<3",
    "python-dotenv>=1,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["coverage[toml]>=7.7,<8", "mypy>=1.15,<2", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["services/api", "."]
testpaths = ["services/api/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".uv-cache", ".npm-cache", ".git-initialization-backup"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
mypy_path = "services/api"
files = ["services/api/app"]
ignore_missing_imports = true
check_untyped_defs = true
namespace_packages = true

[tool.coverage.run]
source = ["services/api/app/domain"]
branch = true
